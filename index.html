<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <title>Workout Tracker</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1C1C1E;
      --text-main: #FFFFFF;
      --text-muted: #8E8E93;
      --accent: #0A84FF;
      --accent-success: #30D158;
      --accent-danger: #FF453A;
      --border: #38383A;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overscroll-behavior-y: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Layout Principale */
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .view-section {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 80px); /* Spazio per la bottom nav */
    }
    .view-section.active { display: block; }

    /* Sticky Timer */
    #sticky-timer {
      position: fixed;
      top: var(--safe-top);
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-success);
      color: #000;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      font-size: 1.2rem;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      gap: 8px;
    }
    #sticky-timer.active { display: flex; }

    /* Horizontal Scroll per i Giorni (Pillole) */
    .days-scroll {
      display: flex;
      gap: 12px;
      padding: 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    .days-scroll::-webkit-scrollbar { display: none; }
    
    .day-pill {
      background: var(--card-bg);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid var(--border);
    }
    .day-pill.active {
      background: var(--accent);
      color: #FFF;
      border-color: var(--accent);
    }

    /* Container Esercizi */
    .content-area { padding: 16px; }
    
    .action-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      margin-bottom: 20px;
      color: #FFF;
    }
    .btn-start { background-color: var(--accent-success); }
    .btn-finish { background-color: var(--accent-danger); }
    .btn-disabled { opacity: 0.5; pointer-events: none; }

    /* Card Esercizio */
    .exercise-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .ex-title { font-size: 1.1rem; font-weight: 600; margin: 0 0 4px 0; }
    .ex-target { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    
    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    .set-info {
      display: flex;
      flex-direction: column;
      width: 60px;
    }
    .set-num { font-weight: bold; font-size: 0.9rem; }
    .set-prev { font-size: 0.7rem; color: var(--text-muted); }

    .set-inputs {
      display: flex;
      gap: 10px;
      flex: 1;
      justify-content: center;
    }
    
    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .input-group label { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 2px;}
    
    input[type="number"] {
      width: 60px;
      background: #000;
      border: 1px solid var(--border);
      color: #FFF;
      padding: 8px;
      border-radius: 8px;
      text-align: center;
      font-size: 16px; /* Previene lo zoom su iOS */
      font-weight: bold;
      appearance: none;
    }
    
    .checkbox-wrapper {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    input[type="checkbox"] {
      width: 28px;
      height: 28px;
      accent-color: var(--accent-success);
    }

    /* Storico View */
    .history-dashboard {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .stat-box h3 { margin: 0; font-size: 1.8rem; color: var(--accent); }
    .stat-box p { margin: 4px 0 0 0; font-size: 0.8rem; color: var(--text-muted); }

    .history-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .history-duration { font-size: 0.85rem; color: var(--accent-success); }
    .history-details { margin-top: 12px; font-size: 0.85rem; color: var(--text-muted); }
    .history-details ul { padding-left: 20px; margin: 8px 0 0 0; }

    /* Bottom Navigation iOS Style */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(28, 28, 30, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding-top: 12px;
      padding-bottom: calc(var(--safe-bottom) + 8px);
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      gap: 4px;
    }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 1.4rem; }

  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- Sticky Timer -->
    <div id="sticky-timer">
      <span>⏱</span>
      <span id="timer-display">00:00</span>
    </div>

    <!-- VIEW ALLENAMENTO -->
    <div id="view-workout" class="view-section active">
      <div class="days-scroll" id="days-slider">
        <!-- Generato via JS -->
      </div>
      
      <div class="content-area">
        <button id="btn-start" class="action-btn btn-start" onclick="toggleSession()">Inizia Workout</button>
        <div id="workout-content"></div>
        <button id="btn-finish" class="action-btn btn-finish" style="display:none;" onclick="finishSession()">Termina Workout 🎉</button>
      </div>
    </div>

    <!-- VIEW STORICO -->
    <div id="view-history" class="view-section">
      <div class="content-area">
        <h2 style="margin-top:0;">Attività & Progressi</h2>
        <div class="history-dashboard">
          <div class="stat-box">
            <h3 id="stat-week">0</h3>
            <p>Questa Settimana</p>
          </div>
          <div class="stat-box">
            <h3 id="stat-total">0</h3>
            <p>Workout Totali</p>
          </div>
        </div>
        <div id="history-list"></div>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchView('workout')" id="nav-workout">
        <span class="nav-icon">🏋️</span>
        <span>Allenamento</span>
      </div>
      <div class="nav-item" onclick="switchView('history')" id="nav-history">
        <span class="nav-icon">🕒</span>
        <span>Storico</span>
      </div>
    </div>
  </div>

  <script>
    // --- DATI SCHEDA ---
    const workoutPlan = [
      {
        id: 'upper_a', name: 'Lunedì (Upper A)', 
        exercises: [
          { id: 'u1', name: 'Panca Piana Bilanciere', target: '4x6-8', defaultKg: 50 },
          { id: 'u2', name: 'Trazioni (Prona/Neutra)', target: '4xmax', defaultKg: 0 },
          { id: 'u3', name: 'Dip Parallele', target: '3x8-10', defaultKg: 0 },
          { id: 'u4', name: 'Rematore Bilanciere', target: '3x8-10', defaultKg: 40 },
          { id: 'u5', name: 'Face Pull elastico', target: '3x15-20', defaultKg: 5 }
        ]
      },
      {
        id: 'lower_a', name: 'Martedì (Lower A)',
        exercises: [
          { id: 'l1', name: 'Back Squat', target: '4x6-8', defaultKg: 60 },
          { id: 'l2', name: 'Kettlebell RDL', target: '3x10-12', defaultKg: 20 },
          { id: 'l3', name: 'Affondi Bulgari', target: '3x10', defaultKg: 16 },
          { id: 'l4', name: 'Hanging Leg Raises', target: '3x10-12', defaultKg: 0 }
        ]
      },
      {
        id: 'cardio', name: 'Mercoledì (Cardio)',
        exercises: [
          { id: 'c1', name: 'Corsa Aerobica (Zona 2)', target: '35-45 min', defaultKg: 0 }
        ]
      }
      // Puoi aggiungere Giovedì e Venerdì seguendo questo schema
    ];

    let currentDayId = workoutPlan[0].id;
    let workoutHistory = JSON.parse(localStorage.getItem('workout_history') || '[]');
    
    // --- GESTIONE TIMER SESSIONE ---
    let sessionTimerInterval = null;
    let sessionSeconds = 0;
    let isSessionActive = false;

    function toggleSession() {
      if (!isSessionActive) {
        // Avvia
        isSessionActive = true;
        sessionSeconds = 0;
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('btn-finish').style.display = 'block';
        document.getElementById('sticky-timer').classList.add('active');
        updateSessionTimerDisplay();
        
        sessionTimerInterval = setInterval(() => {
          sessionSeconds++;
          updateSessionTimerDisplay();
        }, 1000);
      }
    }

    function updateSessionTimerDisplay() {
      const m = Math.floor(sessionSeconds / 60).toString().padStart(2, '0');
      const s = (sessionSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;
    }

    function stopSessionTimer() {
      clearInterval(sessionTimerInterval);
      isSessionActive = false;
      document.getElementById('sticky-timer').classList.remove('active');
      document.getElementById('btn-start').style.display = 'block';
      document.getElementById('btn-finish').style.display = 'none';
      const durationMinutes = Math.round(sessionSeconds / 60);
      sessionSeconds = 0;
      return durationMinutes;
    }

    // --- NAVIGAZIONE UI ---
    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`view-${viewName}`).classList.add('active');
      document.getElementById(`nav-${viewName}`).classList.add('active');

      if(viewName === 'history') renderHistory();
    }

    function selectDay(dayId) {
      if (isSessionActive) {
        if(!confirm("Hai un allenamento in corso. Vuoi annullarlo e cambiare giorno?")) return;
        stopSessionTimer();
      }
      currentDayId = dayId;
      renderDaysSlider();
      renderWorkoutContent();
    }

    function renderDaysSlider() {
      const slider = document.getElementById('days-slider');
      slider.innerHTML = '';
      workoutPlan.forEach(day => {
        const pill = document.createElement('div');
        pill.className = `day-pill ${day.id === currentDayId ? 'active' : ''}`;
        pill.innerText = day.name.split(' ')[0]; // Mostra solo "Lunedì", "Martedì" ecc.
        pill.onclick = () => selectDay(day.id);
        slider.appendChild(pill);
      });
    }

    // --- RENDER WORKOUT & PRE-COMPILAZIONE ---
    function getLastSessionDetails(dayId) {
      // Cerca l'ultima sessione per questo giorno
      const pastSessions = workoutHistory.filter(w => w.dayId === dayId);
      if (pastSessions.length === 0) return null;
      return pastSessions[pastSessions.length - 1]; // L'ultima
    }

    function renderWorkoutContent() {
      const container = document.getElementById('workout-content');
      container.innerHTML = '';
      const dayData = workoutPlan.find(d => d.id === currentDayId);
      const lastSession = getLastSessionDetails(currentDayId);

      dayData.exercises.forEach(ex => {
        const numSets = parseInt(ex.target.split('x')[0]) || 1;
        const targetReps = ex.target.split('x')[1] || ex.target;
        
        let setsHtml = '';
        for (let i = 1; i <= numSets; i++) {
          // Recupero dati pre-compilazione
          let prevKg = ex.defaultKg;
          let prevReps = targetReps;
          let prevStr = "Nuovo";

          if (lastSession && lastSession.exercises[ex.id] && lastSession.exercises[ex.id][i-1]) {
            const pastSet = lastSession.exercises[ex.id][i-1];
            prevKg = pastSet.kg;
            prevReps = pastSet.reps;
            prevStr = `${prevKg}kg × ${prevReps}`;
          }

          setsHtml += `
            <div class="set-row" data-ex="${ex.id}" data-set="${i}">
              <div class="set-info">
                <span class="set-num">Set ${i}</span>
                <span class="set-prev">${prevStr}</span>
              </div>
              <div class="set-inputs">
                <div class="input-group">
                  <label>Kg</label>
                  <input type="number" class="val-kg" inputmode="decimal" value="${prevKg}">
                </div>
                <div class="input-group">
                  <label>Reps</label>
                  <input type="number" class="val-reps" inputmode="numeric" value="${parseInt(prevReps)||0}">
                </div>
              </div>
              <div class="checkbox-wrapper">
                <input type="checkbox" class="val-check">
              </div>
            </div>
          `;
        }

        container.innerHTML += `
          <div class="exercise-card">
            <h4 class="ex-title">${ex.name}</h4>
            <div class="ex-target">Obiettivo: ${ex.target}</div>
            ${setsHtml}
          </div>
        `;
      });
    }

    // --- SALVATAGGIO WORKOUT ---
    function finishSession() {
      const duration = stopSessionTimer();
      const rows = document.querySelectorAll('.set-row');
      let sessionData = {
        date: new Date().toISOString(),
        dayId: currentDayId,
        durationMin: duration,
        exercises: {}
      };

      let completedAny = false;

      rows.forEach(row => {
        const isChecked = row.querySelector('.val-check').checked;
        if (isChecked) {
          completedAny = true;
          const exId = row.dataset.ex;
          const kg = row.querySelector('.val-kg').value;
          const reps = row.querySelector('.val-reps').value;
          
          if (!sessionData.exercises[exId]) sessionData.exercises[exId] = [];
          sessionData.exercises[exId].push({ kg: kg, reps: reps });
        }
      });

      if (!completedAny) {
        alert("Non hai spuntato nessuna serie!");
        return;
      }

      workoutHistory.push(sessionData);
      localStorage.setItem('workout_history', JSON.stringify(workoutHistory));
      
      alert(`Workout completato in ${duration} minuti! Dati salvati nello storico.`);
      
      // Resetta i check per la prossima volta
      document.querySelectorAll('.val-check').forEach(cb => cb.checked = false);
    }

    // --- RENDER STORICO ---
    function renderHistory() {
      document.getElementById('stat-total').innerText = workoutHistory.length;
      
      const oneWeekAgo = new Date();
      oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
      const weekCount = workoutHistory.filter(w => new Date(w.date) > oneWeekAgo).length;
      document.getElementById('stat-week').innerText = weekCount;

      const container = document.getElementById('history-list');
      container.innerHTML = '';

      if (workoutHistory.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:gray;">Nessun workout registrato.</p>';
        return;
      }

      // Mostra dal più recente
      [...workoutHistory].reverse().forEach(session => {
        const d = new Date(session.date);
        const dateStr = d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
        const dayName = workoutPlan.find(p => p.id === session.dayId)?.name || 'Workout';
        
        let detailsHtml = '<ul>';
        Object.keys(session.exercises).forEach(exId => {
          const exName = workoutPlan.flatMap(d => d.exercises).find(e => e.id === exId)?.name || 'Esercizio';
          const sets = session.exercises[exId];
          detailsHtml += `<li><strong>${exName}</strong>: ${sets.length} serie (es. ultima ${sets[sets.length-1].kg}kg × ${sets[sets.length-1].reps})</li>`;
        });
        detailsHtml += '</ul>';

        container.innerHTML += `
          <div class="history-card">
            <div class="history-header">
              <span>${dateStr} - ${dayName.split(' ')[0]}</span>
              <span class="history-duration">⏱ ${session.durationMin} min</span>
            </div>
            <div class="history-details">
              ${detailsHtml}
            </div>
          </div>
        `;
      });
    }

    // --- INIZIALIZZAZIONE ---
    window.onload = () => {
      renderDaysSlider();
      renderWorkoutContent();
    };
  </script>
</body>
</html>
